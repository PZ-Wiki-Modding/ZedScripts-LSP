[project]
name = "ZedScripts"
description = "ZedScripts Language Server Protocol for Project Zomboid's Script format"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
version = "1.2.0"
license = {file = "LICENSE"}
authors = [
  { name = "SimKDT" },
]
dependencies = [
    "lsprotocol",
    "pygls",
    "requests-cache",
    "pydantic",
    "deepmerge",
]

[project.optional-dependencies]
build = [
    "pyinstaller"
]
debug = [
    "debugpy"
]
test = [
    "pytest"
]
pygments = [
    "pygments"
]

# used to load locale JSON files
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
highlight-zedscripts = "ZedScripts.structure.pygments_lexer:main"

[tool.setuptools.package-data]
ZedScripts = [
    "locale/*.json"
]

# uv configs
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
