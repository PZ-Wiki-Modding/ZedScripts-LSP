[project]
name = "ZedScripts"
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
version = "1.0.0"
# license = "MIT"
# license-files = ["LICENSE"]
authors = [
  { name = "SimKDT" },
]
dependencies = [
    "pygls",
]

[dependency-groups]
build = [
  "pyinstaller"
]

# used to load locale JSON files
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ZedScripts = [
  "locale/*.json"
]