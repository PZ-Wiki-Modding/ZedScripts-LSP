[project]
name = "ZedScripts-LSP"
description = ""
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12.3"
version = "0.0.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "SimKDT" },
]
dependencies = [
    "lsprotocol",
    "pygls",
    "requests-cache",
    "pydantic",
    "deepmerge",
]

[project.optional-dependencies]
build = [
    "pyinstaller"
]
debug = [
    "debugpy"
]

# used to load locale JSON files
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ZedScripts = [
    "locale/*.json"
]
