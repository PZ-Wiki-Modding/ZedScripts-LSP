name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    name: Build Python Wheel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  build-executable:
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.name }} Executable
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            name: Linux
            artifact-name: linux-executable
            executable-path: dist/ZedScripts
          - runner: windows-latest
            name: Windows
            artifact-name: windows-executable
            executable-path: dist/ZedScripts.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm ZedScripts.spec

      - name: Upload ${{ matrix.name }} executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.executable-path }}
          retention-days: 1

  create-release:
    needs: [build-wheel, build-executable]
    runs-on: ubuntu-latest
    name: Create Release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          # Copy wheel
          cp artifacts/wheel/*.whl release/
          # Copy and rename Linux executable
          cp artifacts/linux-executable/ZedScripts release/ZedScripts-linux-x86_64
          # Copy and rename Windows executable
          cp artifacts/windows-executable/ZedScripts.exe release/ZedScripts-windows-x86_64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
