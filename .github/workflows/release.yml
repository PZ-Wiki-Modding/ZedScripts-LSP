name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync --extra test

      - name: Run pytest
        run: |
          uv run pytest

  build-schema:
    needs: [run-tests]
    runs-on: ubuntu-latest
    name: Generate schema

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync

      - name: Generate schema
        run: |
          make build_schema

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema
          path: schema/zedscripts.json
          retention-days: 1

  build-wheel:
    needs: [run-tests]
    runs-on: ubuntu-latest
    name: Build Python Wheel

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync --extra build

      - name: Build wheel
        run: |
          uv build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 1

  build-executable:
    needs: [run-tests]
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.name }} Executable
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            name: Linux
            artifact-name: linux-executable
            executable-path: dist/ZedScripts
          - runner: windows-latest
            name: Windows
            artifact-name: windows-executable
            executable-path: dist/ZedScripts.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install build dependencies
        run: |
          uv sync --extra build

      - name: Build executable
        run: |
          make build_app

      - name: Upload ${{ matrix.name }} executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.executable-path }}
          retention-days: 1

  create-release:
    needs: [run-tests, build-schema, build-wheel, build-executable]
    runs-on: ubuntu-latest
    name: Create Release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          # Copy wheel
          cp artifacts/wheel/*.whl release/
          # Copy and rename Linux executable
          cp artifacts/linux-executable/ZedScripts release/ZedScripts-linux-x86_64
          # Copy and rename Windows executable
          cp artifacts/windows-executable/ZedScripts.exe release/ZedScripts-windows-x86_64.exe
          # Copy schema
          cp artifacts/schema/zedscripts.json release/zedscripts.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
